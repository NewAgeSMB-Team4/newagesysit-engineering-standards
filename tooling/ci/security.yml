# Example GitHub Actions security workflow for a consuming project.
# Review action versions and permissions under company policy. Actions are pinned to full commit SHAs.
name: Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
  secret-scan:
    # Official Gitleaks Docker image, not gitleaks-action (which needs a paid licence for organisation
    # repositories). The image is pinned by digest (tag in the trailing comment); update both together.
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so secrets committed earlier and later removed are still found
          persist-credentials: false
      # Fails the job if a secret is found. --redact keeps secret values out of the job log.
      # False positives: add the finding's fingerprint to .gitleaksignore after review; never disable the job.
      - name: Scan repository history
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git --redact --verbose --exit-code 1 /repo
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
